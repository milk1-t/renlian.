<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 人脸表情识别系统</title>
    <link href="{{ url_for('static', filename='new/font-awesome.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='framework/jquery-1.11.3.min.js') }}"></script>
    <script src="{{ url_for('static', filename='new/tailwindcss.js') }}"></script>
    <script src="{{ url_for('static', filename='new/layer.js') }}"></script>
    <link href="{{ url_for('static', filename='new/layer.css') }}" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-register {
                @apply w-full bg-blue-500 text-white py-3 rounded-lg font-medium transition-all duration-300;
            }
            .btn-register:hover {
                @apply bg-blue-600 shadow-lg shadow-blue-500/30;
            }
            .input-field {
                @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300;
            }
        }
    </style>
    <style>
        :root {
            --primary-blue: #2563eb;
            --light-blue: #3b82f6;
            --bg-white: #ffffff;
            --text-secondary: #64748b;
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
        }
        .register-container {
            background: var(--bg-white);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
        }
        .register-header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--light-blue) 100%);
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .input-wrapper { position: relative; }
        .input-wrapper input { padding-left: 45px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="register-container w-full max-w-md overflow-hidden">
        <div class="register-header p-8 text-center">
            <div class="w-20 h-20 bg-white rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
                <i class="fa fa-user-plus text-5xl text-blue-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">用户注册</h1>
            <p class="text-blue-100 mt-2">Face Expression Recognition</p>
        </div>
        <div class="p-8">
            <form method="POST" action="" id="registerForm">
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-user mr-2 text-blue-500"></i>用户名
                    </label>
                    <div class="input-wrapper">
                        <i class="fa fa-user input-icon"></i>
                        <input type="text" name="username" class="input-field" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-lock mr-2 text-blue-500"></i>密码
                    </label>
                    <div class="input-wrapper">
                        <i class="fa fa-lock input-icon"></i>
                        <input type="password" name="password" class="input-field" placeholder="请输入密码" required autocomplete="new-password">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-check mr-2 text-blue-500"></i>确认密码
                    </label>
                    <div class="input-wrapper">
                        <i class="fa fa-lock input-icon"></i>
                        <input type="password" name="password_confirm" class="input-field" placeholder="请再次输入密码" required>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-medium mb-2">
                        <i class="fa fa-id-card mr-2 text-blue-500"></i>昵称（选填）
                    </label>
                    <div class="input-wrapper">
                        <i class="fa fa-id-card input-icon"></i>
                        <input type="text" name="name" class="input-field" placeholder="请输入昵称" autocomplete="name">
                    </div>
                </div>
                <button type="submit" class="btn-register">
                    <i class="fa fa-user-plus mr-2"></i>注 册
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="{{ url_for('login') }}" class="text-blue-500 hover:text-blue-600 text-sm">
                    <i class="fa fa-sign-in mr-1"></i>已有账号？去登录
                </a>
            </div>
        </div>
    </div>
    <script>
        $('#registerForm').on('submit', function(e) {
            var pwd = $('input[name="password"]').val();
            var pwd2 = $('input[name="password_confirm"]').val();
            if (pwd !== pwd2) {
                layer.msg('两次密码不一致', {icon: 2});
                e.preventDefault();
                return false;
            }
            if (pwd.length < 6) {
                layer.msg('密码至少6位', {icon: 2});
                e.preventDefault();
                return false;
            }
        });
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    {% if category == 'success' %}
                    layer.msg('{{ message }}', {icon: 1, time: 2000});
                    {% else %}
                    layer.msg('{{ message }}', {icon: 2, time: 2000});
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
